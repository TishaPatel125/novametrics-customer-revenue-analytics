version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: novametrics_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: novametrics_user
      POSTGRES_PASSWORD: novametrics_password
      POSTGRES_DB: novametrics_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novametrics_user -d novametrics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: novametrics_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://novametrics_user:novametrics_password@db:5432/novametrics_db
      - SECRET_KEY=supersecretkeyforproductiondemo
    ports:
      - "8000:8000"
    command: >
      sh -c "python scripts/generate_data.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # 3. Streamlit Analytics Dashboard
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: novametrics_dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:8000/api/v1
    ports:
      - "8501:8501"

volumes:
  postgres_data:
